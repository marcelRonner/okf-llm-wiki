# The page types of this wiki — the single authoritative definition.
#
# Everything else is derived from this file or checked against it:
#
#   scripts/wikilib.py                 loads it (no hardcoded type list anywhere)
#   AGENTS.md                          its page-type table and frontmatter example are GENERATED
#   README.md                          its layout tree is GENERATED
#   content/<folder>/, templates/<type>.md  scaffolded by `make new-type`
#
# Run `make schema` after editing. `make build` fails if the generated blocks are stale, so
# the schema and the assistant's instructions cannot drift apart.
#
# Fields:
#   folder            where pages of this type live, under content/
#   label             heading used for this type in the generated index
#   holds             one sentence for the assistant: what belongs here (goes in the LLM table)
#   short             a few words for the README layout tree
#   dated_filenames   true if filenames are prefixed YYYY-MM-DD- (things that sort by date)
#   rules             the file in .claude/rules/ that governs this type, without .md (optional)

types:
  project:
    folder: projects
    label: Projects
    holds: A piece of work with a goal and an end. What it is for, where it stands, who is involved.
    short: work with a goal and an end
    dated_filenames: false
    rules: projects-systems

  system:
    folder: systems
    label: Systems
    holds: A thing that exists and keeps existing — a service, a tool, a process. How it works, how it fails.
    short: things that keep running and need maintaining
    dated_filenames: false
    rules: projects-systems

  decision:
    folder: decisions
    label: Decisions
    holds: One decision — what was chosen, what was rejected, why, and whether it still holds.
    short: what was chosen, what was rejected, why
    dated_filenames: true
    rules: decisions



  topic:
    folder: topics
    label: Topics
    holds: A concept that keeps coming up and does not fit the above.
    short: concepts that fit nowhere else
    dated_filenames: false
    rules: pages

  source:
    folder: sources
    label: Sources
    holds: What one piece of raw material said, and what it changed. One per item in content/references/, plus the monthly owner-notes pages.
    short: one page per item in content/references/, plus monthly owner notes
    dated_filenames: true
    rules: sources

# --------------------------------------------------------------------------------------------
# Thresholds the mechanical checks use. Changing a number here changes what `make lint` warns
# about — no code edit needed.

limits:
  description_chars: 200    # descriptions longer than this crowd the index
  page_words: 400           # past this, look for a section that wants to be its own page
  stub_days: 90             # a stub older than this is either worth filling or worth deleting
  placeholder: "TODO"       # a description still containing this was never written
  unverified_days: 365      # past this with no `verified:` entry, lint asks the owner to read it
