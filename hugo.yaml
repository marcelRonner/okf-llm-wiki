# Hugo configuration. The site is built from `content/` with the Docsy theme.
#
# There is no `menu:` or nav list on purpose. Docsy builds the sidebar from the folder tree, so
# adding a page never requires editing this file — one less thing that can drift out of sync.

title: OKF LLM Wiki
baseURL: /
locale: en-gb

# `site/` rather than Hugo's default `public/`, matching .gitignore and `make clean`.
publishDir: site

# This wiki has its own tag index at content/tags.md, generated by `make index`. Hugo's built-in
# taxonomy pages would claim the same /tags/ URL, so they stay off.
disableKinds: [taxonomy, term]

module:
  hugoVersion:
    extended: true
    min: 0.160.1
  imports:
    - path: github.com/google/docsy/theme
      # Docsy's sidebar-and-TOC chrome lives in `layouts/docs/`, which Hugo only reaches for pages
      # whose `type` is `docs`. Every page here already has a `type` — it is this wiki's page type
      # (`topic`, `decision`, `source`, …), defined in schema.yml — and an explicit `type` makes
      # Hugo skip section-based lookup, so those pages would fall through to Docsy's bare `all.html`
      # with no sidebar.
      #
      # Mounting `layouts/docs` at the layout root makes its single/list/baseof the site-wide
      # fallback, so every page gets the docs chrome whatever its wiki type. The remaining mounts
      # are Docsy's own, copied from its hugo.yaml: declaring `mounts` here replaces the module's
      # defaults, so they have to be restated. Re-check them against the theme's hugo.yaml after
      # `hugo mod get -u`.
      mounts:
        - source: layouts/docs
          target: layouts
        - source: layouts
          target: layouts
        - source: assets
          target: assets
        - source: node_modules/bootstrap
          target: assets/vendor/bootstrap
        - source: node_modules/@fortawesome/fontawesome-free
          target: assets/vendor/Font-Awesome
        - source: i18n
          target: i18n
        - source: static
          target: static
        - source: node_modules/@fortawesome/fontawesome-free/webfonts
          target: static/webfonts

markup:
  goldmark:
    parser:
      attribute:
        block: true
    renderer:
      # Docsy requires this; pages may contain inline HTML (the generated backlink markers).
      unsafe: true
    extensions:
      table: true
      footnote: true
      definitionList: true
      taskList: true
      strikethrough: true
  highlight:
    # Required for dark mode — Docsy swaps the Chroma stylesheet rather than inlining colours.
    noClasses: false
  tableOfContents:
    startLevel: 2
    endLevel: 4

params:
  description: A personal knowledge wiki, maintained with an AI assistant, in the Open Knowledge Format

  # Docsy's built-in client-side search.
  offlineSearch: true
  offlineSearchSummaryLength: 70
  offlineSearchMaxResults: 10

  ui:
    showLightDarkModeMenu: true
    sidebar_menu_compact: false
    sidebar_menu_foldable: true
    sidebar_search_disable: false
    sidebar_root_enabled: true
    breadcrumb_disable: false
    # Both are for public documentation sites with an audience; this wiki has one reader.
    feedback:
      enable: false
    readingtime:
      enable: false
