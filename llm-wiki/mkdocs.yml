site_name: Knowledge Wiki
site_description: A personal knowledge wiki, maintained with an AI assistant

docs_dir: wiki

# No `nav:` on purpose. MkDocs builds the navigation from the folder tree, so adding a page
# never requires editing this file — one less thing that can drift out of sync.

theme:
  name: material
  features:
    - navigation.instant
    - navigation.top
    - navigation.indexes
    - search.suggest
    - search.highlight
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

markdown_extensions:
  - meta
  - tables
  - attr_list
  - def_list
  - admonition
  - footnotes
  - toc:
      permalink: true
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.tasklist:
      custom_checkbox: true

plugins:
  - search

# `raw/` is deliberately outside docs_dir: the originals are not published, only linked from
# source pages. If you want them browsable, symlink or copy them into wiki/ and say so here.
